version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: leasemate-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: leasemate_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: leasemate-backend
    expose:
      - "5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGUSER: postgres
      PGPASSWORD: "1234"
      PGHOST: db
      PGDATABASE: leasemate_db
      PGPORT: 5432
      JWT_SECRET: supersecretkey
    restart: on-failure

  frontend:
    build: ./frontend
    container_name: leasemate-frontend
    ports:
      - "8090:5173"
    depends_on:
      - backend

volumes:
  pgdata: